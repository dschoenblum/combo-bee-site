<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Combo Bee</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#FCF9F2; --panel:#FFFFFF; --panel-2:#F6F1E4;
    --ink:#221C10; --muted:#82796A; --faint:#B3A98F;
    --border:#E8E0CE; --border-strong:#D6CBB0;
    --honey:#F3B70C; --honey-soft:#FDEBB4; --honey-deep:#8A6400; --honey-ink:#221C10;
    --good:#3E7C4F; --good-soft:#E2EFE4;
    --bad:#A8433F; --bad-soft:#F7E4E1;
    --shadow:0 1px 2px rgba(60,45,10,.06),0 4px 16px rgba(60,45,10,.07);
    --scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1A160C; --panel:#242013; --panel-2:#2C2717;
      --ink:#F1E9D6; --muted:#9C9179; --faint:#6C6350;
      --border:#3A3421; --border-strong:#4C452E;
      --honey:#F0B429; --honey-soft:#453711; --honey-deep:#E8C669; --honey-ink:#221C10;
      --good:#7DB98B; --good-soft:#25361F;
      --bad:#E08A80; --bad-soft:#43241F;
      --shadow:0 1px 2px rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.3);
      --scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1A160C; --panel:#242013; --panel-2:#2C2717;
    --ink:#F1E9D6; --muted:#9C9179; --faint:#6C6350;
    --border:#3A3421; --border-strong:#4C452E;
    --honey:#F0B429; --honey-soft:#453711; --honey-deep:#E8C669; --honey-ink:#221C10;
    --good:#7DB98B; --good-soft:#25361F;
    --bad:#E08A80; --bad-soft:#43241F;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.3);
    --scheme:dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Work Sans",system-ui,-apple-system,sans-serif;
    margin:0; min-height:100vh; line-height:1.45;
  }
  .wrap{max-width:600px; margin:0 auto; padding:22px 16px 72px; touch-action:manipulation}
  button,label{touch-action:manipulation}
  button{font:inherit; color:inherit; cursor:pointer; border:none; background:none; padding:0}
  button:focus-visible,a:focus-visible{outline:2px solid var(--honey); outline-offset:2px; border-radius:6px}

  /* ---------- header ---------- */
  header{display:flex; align-items:baseline; gap:10px; margin-bottom:4px}
  h1{
    font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:1.7rem;
    margin:0; letter-spacing:-.01em;
  }
  h1 .hex-dot{color:var(--honey)}
  .tagline{color:var(--muted); font-size:.82rem; margin:0 0 18px}

  /* ---------- setup ---------- */
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:18px; box-shadow:var(--shadow);
  }
  .label{
    font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin:0 0 10px;
  }
  .alpha{display:grid; grid-template-columns:repeat(7,1fr); gap:7px}
  .key{
    aspect-ratio:1; border-radius:10px; border:1px solid var(--border-strong);
    background:var(--panel-2); font-weight:600; font-size:1.02rem; text-transform:uppercase;
    display:flex; align-items:center; justify-content:center; position:relative;
    transition:transform .06s ease, background .12s, border-color .12s, opacity .12s;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  .key:active{transform:scale(.93)}
  .key.sel{background:var(--honey); border-color:var(--honey); color:var(--honey-ink); font-weight:700}
  .key.dead{opacity:.32; pointer-events:none}
  .key .rare{
    position:absolute; top:3px; right:5px; font-size:.5rem; color:var(--faint); font-weight:700;
  }
  .key.sel .rare{color:var(--honey-ink); opacity:.55}
  .readout{
    margin-top:14px; min-height:2.4em; font-size:.88rem; color:var(--muted);
    display:flex; align-items:center;
  }
  .readout b{color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}
  .seg{
    display:flex; margin-top:12px; border:1px solid var(--border-strong); border-radius:10px;
    overflow:hidden; font-size:.8rem;
  }
  .seg button{flex:1; padding:9px 6px; background:var(--panel-2); color:var(--muted); font-weight:500}
  .seg button.on{background:var(--honey); color:var(--honey-ink); font-weight:700}
  .seg button:disabled{pointer-events:none}
  .seg button:disabled:not(.on){opacity:.45}
  .seg-note{margin:8px 2px 0; font-size:.72rem; color:var(--faint)}
  .countrow{
    display:flex; align-items:center; gap:8px; margin-top:12px;
    font-size:.8rem; color:var(--muted); cursor:pointer; user-select:none;
  }
  .countrow input{accent-color:var(--honey); width:16px; height:16px; margin:0}
  .actions{display:flex; gap:10px; margin-top:16px}
  .btn{
    flex:1; padding:13px 10px; border-radius:12px; font-weight:700; font-size:.95rem;
    border:1px solid var(--border-strong); background:var(--panel-2); text-align:center;
    transition:transform .06s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--honey); border-color:var(--honey); color:var(--honey-ink)}
  .btn:disabled{opacity:.4; pointer-events:none}
  .linkrow{display:flex; justify-content:space-between; margin-top:14px; font-size:.82rem}
  .linkbtn{color:var(--honey-deep); font-weight:600; text-decoration:underline; text-underline-offset:3px}
  .linkbtn:disabled{opacity:.45; pointer-events:none}
  .randgrp{display:flex; align-items:center; gap:9px}
  .sizewrap{position:relative; display:inline-flex; align-items:center}
  .sizewrap::after{
    content:"\25BE"; position:absolute; right:7px; font-size:.7rem; color:var(--muted); pointer-events:none;
  }
  .sizesel{
    appearance:none; -webkit-appearance:none; color-scheme:var(--scheme);
    font:inherit; font-size:.76rem; font-weight:600; color:var(--muted);
    background:var(--panel-2); border:1px solid var(--border-strong); border-radius:8px;
    padding:3px 20px 3px 8px;
  }
  .foot{margin-top:20px; font-size:.72rem; color:var(--faint); line-height:1.6}
  .foot a{color:inherit}

  /* ---------- shared view header ---------- */
  .viewbar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
  .back{
    font-size:.82rem; font-weight:600; color:var(--muted); padding:6px 10px;
    border:1px solid var(--border); border-radius:99px; background:var(--panel);
  }
  .combo-chips{display:flex; gap:5px}
  .mini-hex{
    width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    background:var(--honey); color:var(--honey-ink); font-weight:700; font-size:.85rem;
    text-transform:uppercase;
    clip-path:polygon(25% 3%,75% 3%,98% 50%,75% 97%,25% 97%,2% 50%);
  }
  .rulepill{
    margin-left:auto; font-size:.68rem; font-weight:600; color:var(--muted);
    border:1px solid var(--border); border-radius:99px; padding:5px 10px; background:var(--panel);
  }

  /* ---------- study ---------- */
  .study-sum{font-size:.85rem; color:var(--muted); margin:0 0 12px}
  .study-sum b{color:var(--ink)}
  .wordgrid{display:flex; flex-wrap:wrap; gap:8px}
  .wchip{
    display:inline-flex; align-items:baseline; gap:6px;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:7px 11px; font-size:.95rem; font-weight:500;
    text-decoration:none; color:var(--ink);
  }
  .wchip.allset{background:var(--honey-soft); border-color:var(--honey)}
  .wchip .ct{font-size:.68rem; color:var(--muted); font-variant-numeric:tabular-nums}
  .lenhead{
    width:100%; font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin:14px 0 2px;
  }
  .lenhead:first-child{margin-top:0}
  .legend{margin-top:18px; font-size:.72rem; color:var(--faint)}

  /* ---------- train ---------- */
  .entry{
    text-align:center; min-height:56px; display:flex; align-items:center; justify-content:center;
    font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:1.9rem;
    letter-spacing:.06em; text-transform:uppercase;
  }
  .entry .caret{
    display:inline-block; width:2px; height:1.2em; background:var(--honey);
    margin-left:2px; animation:blink 1s step-end infinite; vertical-align:-.2em;
  }
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){
    .entry .caret{animation:none}
    .key:active,.btn:active,.hexb:active{transform:none}
    .shake{animation:none !important}
  }
  .entry.shake{animation:shake .3s}
  @keyframes shake{
    20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
  }
  .hive{display:flex; flex-direction:column; align-items:center; gap:0; margin:6px 0 16px}
  .hive-row{display:flex; gap:8px}
  .hive-row + .hive-row{margin-top:-14px}
  /* the 6-letter ring is the real Bee's hive minus its middle cell: one cell on top,
     two pairs, one on the bottom, every cell 79.4px from the hole's centre. Rows 1→2
     and 3→4 step half that (39.7px), row 2→3 a whole one. */
  .hive.ring .hive-row{gap:53.6px}
  .hive.ring .hive-row + .hive-row{margin-top:-36.3px}
  .hive.ring .hive-row:nth-child(3){margin-top:3.4px}
  .hexb{
    width:84px; height:76px; display:flex; align-items:center; justify-content:center;
    background:var(--honey); color:var(--honey-ink);
    font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:1.7rem; text-transform:uppercase;
    clip-path:polygon(25% 3%,75% 3%,98% 50%,75% 97%,25% 97%,2% 50%);
    transition:transform .06s ease, filter .06s;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  .hexb:active{transform:scale(.9); filter:brightness(1.06)}
  .ctrls{display:flex; justify-content:center; gap:10px; margin-bottom:18px}
  .pillbtn{
    padding:11px 20px; border-radius:99px; border:1px solid var(--border-strong);
    background:var(--panel); font-weight:600; font-size:.9rem;
  }
  .pillbtn:active{transform:scale(.96)}
  .pillbtn.go{background:var(--honey); border-color:var(--honey); color:var(--honey-ink); font-weight:700}
  .progress{
    text-align:center; font-size:.82rem; color:var(--muted); margin-bottom:12px;
    font-variant-numeric:tabular-nums;
  }
  .progress b{color:var(--ink)}
  .entered{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; min-height:34px}
  .echip{
    display:inline-flex; align-items:center;
    border:1px solid var(--border-strong); background:var(--panel); border-radius:99px;
    padding:6px 13px; font-size:.88rem; font-weight:500;
  }
  .solved{
    text-align:center; background:var(--good-soft); border:1px solid var(--good);
    border-radius:16px; padding:14px 16px 16px; margin-bottom:16px;
  }
  .solved .score{color:var(--good); font-size:1.35rem}
  .solved-sub{color:var(--muted); font-size:.82rem; margin:0 0 12px}
  .solved .actions{margin-top:0}
  .checkrow{margin-top:22px; display:flex; justify-content:center}
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); font-size:.82rem; font-weight:600;
    padding:9px 16px; border-radius:99px; opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:5; white-space:nowrap;
  }
  .toast.show{opacity:1}
  .toast.good{background:var(--good-soft); color:var(--good); border:1px solid var(--good)}
  .toast.bad{background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad)}

  /* ---------- results ---------- */
  .score{
    font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:1.55rem; margin:2px 0 2px;
  }
  .score-sub{color:var(--muted); font-size:.85rem; margin:0 0 18px}
  .rsec{margin-bottom:18px}
  .rsec .label{margin-bottom:8px}
  .rsec .label .n{color:var(--faint); letter-spacing:0; margin-left:4px}
  .wchip.hit{background:var(--good-soft); border-color:var(--good)}
  .wchip.miss{border-color:var(--honey); border-style:dashed}
  .wchip.bad{background:var(--bad-soft); border-color:var(--bad); text-decoration:line-through; color:var(--bad)}
  .none{font-size:.85rem; color:var(--faint)}
  .rsec .actions{margin-top:4px}
</style>
</head>

  <p class="tagline">Drill the words the Spelling Bee builds from just a few letters.</p>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>

/* Bucketed by combo size: [0] is every size, [n] the n-letter combos. A combo needs
   >= 3 words to be worth drilling — except at size 2, where the whole corpus tops out
   at 2 (boob/booboo, epee/peep, naan/nana ...), so that size takes the best there is. */
const noRare = sig => ![...sig].some(L => RARE.has(L));
const bySize = (count, keep = () => true) => {
  const ok = (s, min) => count[s] >= min && keep(s);
  const b = [ALL_SIGS.filter(s => ok(s, 3))];
  for (let n = 2; n <= 6; n++) b[n] = ALL_SIGS.filter(s => s.length === n && ok(s, n === 2 ? 2 : 3));
  return b;
};
const RANDOM_EXACT = bySize(EXACT_COUNT);
const RANDOM_ANY = bySize(SUBSET_COUNT);
const RANDOM_EXACT_COMMON = bySize(EXACT_COUNT, noRare);
const RANDOM_ANY_COMMON = bySize(SUBSET_COUNT, noRare);
const N_PUZZLES = 3042;
const DATE_RANGE = "May 2018 – September 2026";   // both rewritten by build.py

function sigOf(arr){ return [...new Set(arr)].sort().join(""); }
function subsetWords(sel){
  const s = new Set(sel);
  return WORDS.filter(o => [...o.set].every(L => s.has(L)));
}
function exactWords(sel){
  const sig = sigOf(sel);
  return WORDS.filter(o => o.set === sig);
}
function targetWords(sel, exact){ return exact ? exactWords(sel) : subsetWords(sel); }
function pickable(){ return state.showRare ? LETTERS : LETTERS.filter(L => !RARE.has(L)); }
function randomPool(){
  const p = state.showRare
    ? (state.exact ? RANDOM_EXACT : RANDOM_ANY)
    : (state.exact ? RANDOM_EXACT_COMMON : RANDOM_ANY_COMMON);
  return p[state.randSize];
}

/* ---------- state ---------- */
let state = {
  showCounts: false,      // reveal target word counts before checking? (default: hidden)
  showRare: false,        // offer J/Q/X/Z in the picker? (default: hidden)
  randSize: 0,            // letters a random combo should have; 0 = any (default)
  view: "setup",          // setup | study | train | results
  sel: [],                // chosen letters, in pick order
  exact: true,            // must every chosen letter be used? (default: yes)
  order: [],              // hive display order
  typed: "",
  entered: [],            // words the player has entered
  results: null
};
try {
  const saved = JSON.parse(localStorage.getItem("combobee") || "null");
  if (saved && Array.isArray(saved.sel)) {
    state.sel = saved.sel.filter(L => pickable().includes(L)).slice(0, 6);
    // note: the every-letter toggle intentionally resets to ON each visit
  }
} catch (e) {}
function persist(){
  try { localStorage.setItem("combobee", JSON.stringify({ sel: state.sel })); } catch (e) {}
}

/* ---------- helpers ---------- */
const app = document.getElementById("app");
const el = (tag, cls, text) => {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (text !== undefined) d.textContent = text;
  return d;
};
let toastTimer = null;
function toast(msg, kind){
  // kind "good"/"bad" tints the pill and adds ✓/✗ so a hit and a reject can't be confused
  const t = document.getElementById("toast");
  t.textContent = (kind === "good" ? "✓ " : kind === "bad" ? "✗ " : "") + msg;
  t.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}
function fmtLast(ym){
  const [y, m] = ym.split("-");
  const mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m - 1];
  return mo + " " + y;
}
function shuffle(a){
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

/* ---------- setup view ---------- */
function renderSetup(){
  app.innerHTML = "";
  const card = el("div", "card");
  card.appendChild(el("p", "label", "Pick 2–6 letters"));

  const grid = el("div", "alpha");
  const full = state.sel.length >= 6;
  const keys = pickable();
  const can = new Set(keys);
  // reachability only counts words you could actually build: rare letters may be hidden
  const cands = WORDS.filter(o => [...o.set].every(x => can.has(x)));
  for (const L of keys) {
    const b = el("button", "key", L);
    b.setAttribute("aria-pressed", state.sel.includes(L));
    if (RARE.has(L)) b.appendChild(el("span", "rare", "●"));
    if (state.sel.includes(L)) b.classList.add("sel");
    else if (full) b.classList.add("dead");
    else if (state.sel.length === 5) {
      // last letter: dead unless it adds at least one word under the current rule
      if (state.exact) {
        const sig = sigOf([...state.sel, L]);
        if (!cands.some(o => o.set === sig)) b.classList.add("dead");
      } else {
        const s = new Set([...state.sel, L]);
        if (!cands.some(o => o.set.includes(L) && [...o.set].every(x => s.has(x)))) b.classList.add("dead");
      }
    }
    else if (state.sel.length >= 1) {
      // dead if no word is reachable: not by adding more letters, and — under the skip-letters
      // rule only, since every-letter needs them all used — not within the picks so far either
      const need = [...new Set([...state.sel, L])];
      const any = cands.some(o =>
        need.every(x => o.set.includes(x)) ||
        (!state.exact && o.set.includes(L) && [...o.set].every(x => need.includes(x))));
      if (!any) b.classList.add("dead");
    }
    b.onclick = () => {
      const i = state.sel.indexOf(L);
      if (i >= 0) state.sel.splice(i, 1);
      else if (state.sel.length < 6) state.sel.push(L);
      persist();
      renderSetup();
    };
    grid.appendChild(b);
  }
  card.appendChild(grid);

  const ro = el("div", "readout");
  // everything goes in one span: as direct children of the flex row, each <b>
  // and each text run would become its own flex item and lay out with gaps
  const line = el("span");
  ro.appendChild(line);
  if (state.sel.length < 2) {
    line.textContent = "Tap letters to build a combo.";
  } else {
    const nSub = subsetWords(state.sel).length;
    const nEx = exactWords(state.sel).length;
    const combo = "<b>" + state.sel.map(x => x.toUpperCase()).join(" · ") + "</b>";
    const target = state.exact ? nEx : nSub;
    let html;
    if (!state.showCounts) {
      html = combo + (target === 0 ? "&nbsp;— nothing to drill here" : "");
    } else {
      html = combo + "&nbsp;→ <b>" + target + "</b>&nbsp;word" + (target === 1 ? "" : "s") +
        (state.exact ? " using every letter" : " from these letters");
      if (state.sel.length > 2 && nEx !== nSub) {
        html += state.exact
          ? "&nbsp;(<b>" + nSub + "</b> if letters may be skipped)"
          : "&nbsp;(<b>" + nEx + "</b> use every letter)";
      }
      if (target === 0) html += "&nbsp;— nothing to drill here";
    }
    line.innerHTML = html;
  }
  card.appendChild(ro);

  const seg = el("div", "seg");
  const b2 = el("button", state.exact ? "on" : "", "Must use every letter");
  const b1 = el("button", state.exact ? "" : "on", "Words may skip letters");
  b1.onclick = () => { state.exact = false; renderSetup(); };
  b2.onclick = () => { state.exact = true; renderSetup(); };
  seg.append(b2, b1);
  card.appendChild(seg);

  const rr = el("label", "countrow");
  const rb = document.createElement("input");
  rb.type = "checkbox";
  rb.checked = state.showRare;
  rb.onchange = () => {
    state.showRare = rb.checked;
    if (!state.showRare && state.sel.some(L => RARE.has(L))) {
      state.sel = state.sel.filter(L => !RARE.has(L));   // a hidden letter can't stay picked
      persist();
    }
    renderSetup();
  };
  rr.appendChild(rb);
  rr.appendChild(document.createTextNode("Include rare letters (J, Q, X, Z)"));
  card.appendChild(rr);

  const cr = el("label", "countrow");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = state.showCounts;
  cb.onchange = () => { state.showCounts = cb.checked; renderSetup(); };
  cr.appendChild(cb);
  cr.appendChild(document.createTextNode("Show how many words there are to find"));
  card.appendChild(cr);

  const acts = el("div", "actions");
  const study = el("button", "btn", "Study list");
  const train = el("button", "btn primary", "Train");
  const ready = state.sel.length >= 2 && targetWords(state.sel, state.exact).length > 0;
  study.disabled = train.disabled = !ready;
  study.onclick = () => { state.view = "study"; render(); };
  train.onclick = () => startTrain();
  acts.append(study, train);
  card.appendChild(acts);

  const links = el("div", "linkrow");
  const grp = el("div", "randgrp");
  const pool = randomPool();
  const rand = el("button", "linkbtn", "Random combo");
  rand.disabled = pool.length === 0;   // some sizes have no combo qualifying under the current rules
  rand.onclick = () => {
    state.sel = [...pool[Math.floor(Math.random() * pool.length)]];
    persist();
    renderSetup();
  };
  const sizewrap = el("div", "sizewrap");
  const size = el("select", "sizesel");
  size.setAttribute("aria-label", "Size of a random combo");
  for (const n of [0, 2, 3, 4, 5, 6]) {
    const o = el("option", "", n ? n + " letters" : "Any size");
    o.value = n;
    if (n === state.randSize) o.selected = true;
    size.appendChild(o);
  }
  size.onchange = () => { state.randSize = +size.value; renderSetup(); };
  sizewrap.appendChild(size);
  grp.append(rand, sizewrap);
  const clear = el("button", "linkbtn", "Clear");
  clear.onclick = () => { state.sel = []; persist(); renderSetup(); };
  links.append(grp, clear);
  card.appendChild(links);

  app.appendChild(card);

  const foot = el("p", "foot");
  foot.innerHTML = "Word list compiled from " + N_PUZZLES.toLocaleString() +
    " NYT Spelling Bee puzzles (" + DATE_RANGE + "), " + WORDS.length.toLocaleString() +
    " words with six or fewer distinct letters. Words the Bee has quietly retired — no-shows in recent puzzles that should have included them — are pruned. The list drifts over time, so treat it as very close, not gospel. " +
    "S is left out (one special appearance ever). The rare letters J, Q, X and Z (marked ●) are hidden until you check “Include rare letters”. Minimum word length is 4. By default words must use every chosen letter — flip the toggle to include words that skip some.";
  app.appendChild(foot);
}

/* ---------- view bar ---------- */
function viewbar(backTo){
  const bar = el("div", "viewbar");
  const back = el("button", "back", "← Letters");
  back.onclick = () => { state.view = backTo; render(); };
  bar.appendChild(back);
  const chips = el("div", "combo-chips");
  for (const L of state.sel) chips.appendChild(el("span", "mini-hex", L));
  bar.appendChild(chips);
  bar.appendChild(el("span", "rulepill", state.exact ? "every letter" : "any letters"));
  return bar;
}

/* ---------- study view ---------- */
function renderStudy(){
  app.innerHTML = "";
  app.appendChild(viewbar("setup"));

  const ex = state.exact;
  const words = targetWords(state.sel, state.exact).slice()
    .sort((a, b) => a.w.length - b.w.length || a.w.localeCompare(b.w));
  const sum = el("p", "study-sum");
  sum.innerHTML = "<b>" + words.length + "</b> word" + (words.length === 1 ? "" : "s") +
    (ex ? " using every letter" : " from these letters") + ", shortest first.";
  app.appendChild(sum);

  const grid = el("div", "wordgrid");
  const sig = sigOf(state.sel);
  let lastLen = 0;
  for (const o of words) {
    if (o.w.length !== lastLen) {
      lastLen = o.w.length;
      grid.appendChild(el("div", "lenhead", lastLen + " letters"));
    }
    const isAll = o.set === sig;
    const a = document.createElement("a");
    a.className = "wchip" + (!ex && isAll && state.sel.length > 2 ? " allset" : "");
    a.href = "https://www.google.com/search?q=define+" + o.w;
    a.target = "_blank"; a.rel = "noopener";
    a.title = "Appeared " + o.n + "×, last " + fmtLast(o.last) + " — tap for definition";
    a.appendChild(document.createTextNode(o.w));
    a.appendChild(el("span", "ct", "×" + o.n));
    grid.appendChild(a);
  }
  app.appendChild(grid);

  const leg = el("p", "legend");
  leg.innerHTML = "×N = puzzles it has appeared in" +
    (!ex && state.sel.length > 2 ? " · highlighted words use every chosen letter" : "") +
    " · tap a word for its definition";
  app.appendChild(leg);
}

/* ---------- train view ---------- */
function startTrain(){
  state.order = shuffle(state.sel);
  state.typed = "";
  state.entered = [];
  state.results = null;
  state.view = "train";
  render();
}
function renderTrain(){
  app.innerHTML = "";
  app.appendChild(viewbar("setup"));

  const target = targetWords(state.sel, state.exact);
  if (state.entered.length === target.length) app.appendChild(solvedBanner(target.length));

  const entry = el("div", "entry");
  entry.id = "entry";
  entry.style.fontSize = state.typed.length > 11 ? "1.35rem" : "";
  for (const ch of state.typed.toUpperCase()) entry.appendChild(document.createTextNode(ch));
  entry.appendChild(el("span", "caret"));
  app.appendChild(entry);

  const o = state.order;
  const hive = el("div", o.length === 6 ? "hive ring" : "hive");
  const ROWS = { 2: [[0,1]], 3: [[0],[1,2]], 4: [[0],[1,2],[3]], 5: [[0,1],[2],[3,4]], 6: [[0],[1,2],[3,4],[5]] };
  const rows = ROWS[o.length].map(r => r.map(i => o[i]));
  rows.forEach(r => {
    const row = el("div", "hive-row");
    for (const L of r) {
      const b = el("button", "hexb", L);
      // fire on press, not release: click waits for the finger to lift, and a
      // tiny wobble makes the browser call the tap a drag and swallow it entirely
      b.onpointerdown = e => { if (e.button === 0 && state.typed.length < 19) { state.typed += L; updateEntry(); } };
      row.appendChild(b);
    }
    hive.appendChild(row);
  });
  app.appendChild(hive);

  const ctrls = el("div", "ctrls");
  const del = el("button", "pillbtn", "Delete");
  del.onclick = () => { state.typed = state.typed.slice(0, -1); updateEntry(); };
  const shuf = el("button", "pillbtn", "↻");
  shuf.setAttribute("aria-label", "Shuffle letters");
  shuf.onclick = () => { state.order = shuffle(state.order); renderTrain(); };
  const enter = el("button", "pillbtn go", "Enter");
  enter.onclick = submitTyped;
  ctrls.append(del, shuf, enter);
  app.appendChild(ctrls);

  const prog = el("p", "progress");
  prog.innerHTML = state.showCounts
    ? "<b>" + state.entered.length + "</b> of <b>" + target.length + "</b> found"
    : "<b>" + state.entered.length + "</b> found";
  app.appendChild(prog);

  const list = el("div", "entered");
  list.id = "entered";
  for (let i = state.entered.length - 1; i >= 0; i--) list.appendChild(el("span", "echip", state.entered[i]));
  app.appendChild(list);

  const row = el("div", "checkrow");
  const check = el("button", "btn primary", "Reveal the list");
  check.style.flex = "0 0 auto";
  check.style.padding = "13px 28px";
  check.style.borderRadius = "12px";
  check.onclick = showResults;
  row.appendChild(check);
  app.appendChild(row);
}
function solvedBanner(total){
  const box = el("div", "solved");
  box.appendChild(el("p", "score", "Hive cleared! ⬢"));
  box.appendChild(el("p", "solved-sub", "You found all " + total + " word" + (total === 1 ? "" : "s") + "."));
  const acts = el("div", "actions");
  const see = el("button", "btn", "See the list");
  see.onclick = showResults;
  const fresh = el("button", "btn primary", "New combo");
  fresh.onclick = () => { state.view = "setup"; render(); };
  acts.append(see, fresh);
  box.appendChild(acts);
  return box;
}
function showResults(){
  const target = targetWords(state.sel, state.exact);
  const tset = new Set(target.map(o => o.w));
  state.results = {
    hits: target.filter(o => state.entered.includes(o.w)),
    missed: target.filter(o => !state.entered.includes(o.w)),
    invalid: state.entered.filter(w => !tset.has(w))   // nothing wrong is ever stored now
  };
  state.view = "results";
  render();
}
function updateEntry(){
  const entry = document.getElementById("entry");
  if (!entry) return;
  entry.style.fontSize = state.typed.length > 11 ? "1.35rem" : "";
  entry.innerHTML = "";
  for (const ch of state.typed.toUpperCase()) entry.appendChild(document.createTextNode(ch));
  entry.appendChild(el("span", "caret"));
}
function rejectTyped(msg){
  const entry = document.getElementById("entry");
  if (entry) {
    entry.classList.remove("shake");
    void entry.offsetWidth;
    entry.classList.add("shake");
  }
  toast(msg, "bad");
}
function praiseFor(w, total){
  if (state.entered.length === total) return "That's all of them! ⬢";
  // only a treat when letters may be skipped — under the every-letter rule every hit is one
  if (!state.exact && state.sel.length > 2 && sigOf(w) === sigOf(state.sel)) return "Every letter! ⬢";
  return { 4: "Good!", 5: "Nice!", 6: "Great!" }[w.length] || "Awesome!";
}
function submitTyped(){
  const w = state.typed.toLowerCase();
  if (w.length === 0) return;
  const target = targetWords(state.sel, state.exact);
  // typed letters always come from the combo, so a corpus miss here can only be a skipped letter
  const bad =
    w.length < 4 ? "Too short — 4 letters minimum" :
    state.entered.includes(w) ? "Already found" :
    target.some(o => o.w === w) ? "" :
    state.exact && WORDS.some(o => o.w === w) ? "Missing a letter" :
    "Not in the word list";
  state.typed = "";
  if (bad) { rejectTyped(bad); updateEntry(); return; }
  state.entered.push(w);
  renderTrain();
  toast(praiseFor(w, target.length), "good");
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (state.view === "train") {
    if (e.key === "Enter") { submitTyped(); return; }
    if (e.key === "Backspace") { state.typed = state.typed.slice(0, -1); updateEntry(); return; }
    const k = e.key.toLowerCase();
    if (k.length === 1 && state.sel.includes(k) && state.typed.length < 19) {
      state.typed += k;
      updateEntry();
    }
    return;
  }
  if (state.view === "setup") {
    if (e.key === "Backspace") {
      if (state.sel.length) { state.sel.pop(); persist(); renderSetup(); }
      return;
    }
    if (e.key === "Enter") {
      if (state.sel.length >= 2 && targetWords(state.sel, state.exact).length > 0) startTrain();
      return;
    }
    const k = e.key.toLowerCase();
    if (k.length === 1 && pickable().includes(k)) {
      const i = state.sel.indexOf(k);
      if (i >= 0) state.sel.splice(i, 1);       // typing a selected letter unselects it
      else if (state.sel.length < 6) state.sel.push(k);
      persist();
      renderSetup();
    }
  }
});

/* ---------- results view ---------- */
function renderResults(){
  app.innerHTML = "";
  app.appendChild(viewbar("setup"));
  const r = state.results;
  const total = r.hits.length + r.missed.length;

  app.appendChild(el("p", "score",
    r.missed.length === 0 && r.invalid.length === 0 ? "Perfect hive! ⬢" :
    "You found " + r.hits.length + " of " + total));
  const subs = [];
  if (r.missed.length) subs.push(r.missed.length + " missed");
  if (r.invalid.length) subs.push(r.invalid.length + " not on the list");
  app.appendChild(el("p", "score-sub", subs.length ? subs.join(" · ") : state.sel.map(x => x.toUpperCase()).join("·") + " — all " + total + ", nothing stray."));

  const section = (title, chips, cls, note) => {
    const s = el("div", "rsec");
    const lab = el("p", "label", title);
    lab.appendChild(el("span", "n", String(chips.length)));
    s.appendChild(lab);
    if (chips.length === 0) { s.appendChild(el("p", "none", note)); }
    else {
      const g = el("div", "wordgrid");
      for (const c of chips) {
        if (typeof c === "string") { g.appendChild(el("span", "wchip " + cls, c)); }
        else {
          const a = document.createElement("a");
          a.className = "wchip " + cls;
          a.href = "https://www.google.com/search?q=define+" + c.w;
          a.target = "_blank"; a.rel = "noopener";
          a.title = "Appeared " + c.n + "×, last " + fmtLast(c.last);
          a.appendChild(document.createTextNode(c.w));
          a.appendChild(el("span", "ct", "×" + c.n));
          g.appendChild(a);
        }
      }
      s.appendChild(g);
    }
    return s;
  };
  app.appendChild(section("Found", r.hits, "hit", "None yet — back to the hive."));
  app.appendChild(section("Missed", r.missed, "miss", "Nothing missed. Sharp."));
  if (r.invalid.length) app.appendChild(section("Not on the list", r.invalid, "bad", ""));

  const acts = el("div", "actions");
  const again = el("button", "btn", "Keep training");
  again.onclick = () => { state.view = "train"; render(); };
  const fresh = el("button", "btn primary", "New combo");
  fresh.onclick = () => { state.view = "setup"; render(); };
  acts.append(again, fresh);
  app.appendChild(acts);
}

/* ---------- router ---------- */
function render(){
  window.scrollTo(0, 0);
  if (state.view === "setup") renderSetup();
  else if (state.view === "study") renderStudy();
  else if (state.view === "train") renderTrain();
  else renderResults();
}
render();
</script>

</body>
</html>
